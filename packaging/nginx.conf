# The single entry point: spreads users over the app replicas started by packaging/deploy.sh.
# Replica names resolve on the Docker network; deploy.sh restarts nginx after recreating them.
upstream tc_app {
    ip_hash;   # one user always reaches the same replica (a Streamlit session lives in that replica's RAM)
    # ponytail: if every user comes through ONE company proxy/NAT IP, use `hash $remote_addr$http_user_agent consistent;`
    server tc-vibe-coding-1:8501;
    server tc-vibe-coding-2:8501;
    server tc-vibe-coding-3:8501;
}

server {
    listen 80;
    client_max_body_size 50m;   # = server.maxUploadSize in .streamlit/config.toml

    location / {
        proxy_pass http://tc_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;   # WebSocket: without it the page hangs on "Connecting..."
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;  # keep idle WebSockets open
        proxy_buffering off;
    }
}
