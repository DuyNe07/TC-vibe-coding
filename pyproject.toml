# Tool configuration only. Dependencies live in requirements.txt (single source of truth).
[project]
name = "tc-vibe-coding"
version = "0.1.0"
requires-python = ">=3.11,<3.12"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".venv", "data", "logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N", "SIM"]
ignore = ["E501", "B024", "N818"]  # long lines ok; ABC without abstract methods ok; BusinessRuleViolation name ok

[tool.ruff.lint.isort]
known-first-party = ["backend", "frontend", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/features"]
pythonpath = ["."]
addopts = "-q --import-mode=importlib"
